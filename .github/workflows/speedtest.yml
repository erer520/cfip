name: Cloudflare 优选IP自动更新

on:
  schedule:
    - cron: '0 0,12 * * *'  # 每12小时更新一次（UTC时间，对应北京时间8点/20点）
  workflow_dispatch:  # 支持手动触发
  push:
    paths:
      - 'ip-ranges.txt'  # 网段列表变更时自动触发

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 CloudflareSpeedTest（稳定版 v2.2.5）
        run: |
          mkdir -p tools
          # 主下载源（GitHub镜像）
          wget -q --timeout=30 --tries=3 -O tools/cfst.tgz "https://github.91chi.fun/https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz" || \
          # 备用源1（官方直连）
          wget -q --timeout=30 --tries=3 -O tools/cfst.tgz "https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz" || \
          # 备用源2（jsDelivr CDN）
          wget -q --timeout=30 --tries=3 -O tools/cfst.tgz "https://cdn.jsdelivr.net/gh/XIU2/CloudflareSpeedTest@v2.2.5/CloudflareST_linux_amd64.tar.gz"
          
          tar zxf tools/cfst.tgz -C tools/
          chmod +x tools/CloudflareST
          ls -la tools/

      - name: 运行测速并提取纯IP
        run: |
          cd tools
          # 从上级目录读取网段配置
          ./CloudflareST -f ../ip-ranges.txt -tl 300 -sl 0 -dn 10 -t 5 -p 0 -o result.csv -q
          
          # 提取IP（跳过第一行表头，只取第一列，去重）
          tail -n +2 result.csv | cut -d',' -f1 | uniq > ../ips.txt
          
          echo "===== 测速完成，优选IP列表 ====="
          cat ../ips.txt
          echo ""
          echo "共 $(wc -l < ../ips.txt) 个优选IP"

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查文件是否有变化
          if git diff --quiet ips.txt; then
            echo "IP列表无变化，跳过提交"
          else
            git add ips.txt
            git commit -m "🔄 自动更新优选IP $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "已提交并推送更新"
          fi
